name: Build

on:
  push:
    branches: [preview, dev, test, prod, main]
  pull_request:
    branches: [preview, dev, test, prod, main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static hygiene
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Verify H007 HTTP foundation
        run: npm run verify:h007

      - name: Verify H009 runtime contracts
        run: npm run verify:h009

      - name: Verify H010 Zustand state
        run: npm run verify:h010

      - name: Verify H011 Storage Adapter
        run: npm run verify:h011

      - name: Verify H012 RHF + Zod forms
        run: npm run verify:h012

      - name: Verify H013 MSW network boundary
        run: npm run verify:h013

      - name: Verify H014 Mock scenarios
        run: npm run verify:h014

      - name: Verify H015 JSBridge boundary
        run: npm run verify:h015

      - name: Verify H022 route-state convergence
        run: npm run verify:h022

      - name: Verify H023 shared components
        run: npm run verify:h023

      - name: Smoke test development server
        shell: bash
        run: |
          npm run dev -- --port 4174 > /tmp/dr-card-vite-dev.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:4174/mockServiceWorker.js > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dr-card-vite-dev.log
          exit 1

      - name: Build development bundle
        run: npm run build:dev

      - name: Verify development build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='dev'||m.dataMode!=='mock')process.exit(1)"
          test -f dist/mockServiceWorker.js

      - name: Verify local dev can explicitly use API
        shell: bash
        run: |
          VITE_DATA_MODE=api node scripts/build-h5.mjs dev --dry-run | tee /tmp/local-dev-api.txt
          grep -F '"appEnvironment":"dev"' /tmp/local-dev-api.txt
          grep -F '"dataMode":"api"' /tmp/local-dev-api.txt

      - name: Verify Cloudflare branch-to-mode policy
        shell: bash
        run: |
          CF_PAGES_BRANCH=feature/h006 CF_PAGES_COMMIT_SHA="$GITHUB_SHA" VITE_API_BASE_URL=http://example.invalid node scripts/build-h5.mjs cf --dry-run | tee /tmp/cf-feature-build.txt
          grep -F 'env=preview' /tmp/cf-feature-build.txt
          grep -F '"appEnvironment":"preview"' /tmp/cf-feature-build.txt
          grep -F '"dataMode":"mock"' /tmp/cf-feature-build.txt
          grep -F '"apiBaseConfigured":false' /tmp/cf-feature-build.txt

          CF_PAGES_BRANCH=feature/h006 CF_PAGES_COMMIT_SHA="$GITHUB_SHA" VITE_API_BASE_URL=http://example.invalid node scripts/build-h5.mjs auto --dry-run | tee /tmp/cf-auto-build.txt
          grep -F '"appEnvironment":"preview"' /tmp/cf-auto-build.txt
          grep -F '"dataMode":"mock"' /tmp/cf-auto-build.txt
          grep -F '"apiBaseConfigured":false' /tmp/cf-auto-build.txt

          CF_PAGES_BRANCH=test CF_PAGES_COMMIT_SHA="$GITHUB_SHA" VITE_API_BASE_URL=http://example.invalid VITE_BUDDY_PUBLIC_ORIGIN=https://test.dr-card-ui.pages.dev node scripts/build-h5.mjs cf --dry-run | tee /tmp/cf-test-build.txt
          grep -F '"appEnvironment":"test"' /tmp/cf-test-build.txt
          grep -F '"dataMode":"api"' /tmp/cf-test-build.txt
          grep -F '"bridgeMode":"native"' /tmp/cf-test-build.txt
          grep -F '"apiBaseConfigured":true' /tmp/cf-test-build.txt

          if CF_PAGES_BRANCH=dev VITE_DATA_MODE=api node scripts/build-h5.mjs cf --dry-run; then
            echo 'Cloudflare dev accepted API mode; dev/preview Pages builds must be fixed Mock.'
            exit 1
          fi

          if CF_PAGES_BRANCH=main CF_PAGES_COMMIT_SHA="$GITHUB_SHA" node scripts/build-h5.mjs cf --dry-run; then
            echo 'main must not resolve to a deployable formal-H5 Cloudflare target.'
            exit 1
          fi

      - name: Build Cloudflare preview bundle
        run: CF_PAGES_BRANCH=preview CF_PAGES_COMMIT_SHA="$GITHUB_SHA" npm run build:cf

      - name: Verify Cloudflare preview build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='preview'||m.dataMode!=='mock'||m.build.sha!==process.env.GITHUB_SHA)process.exit(1)"
          test -f dist/mockServiceWorker.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Formal H5 browser regression
        id: formal-e2e
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/dr-card-playwright-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null; then
              npm run test:e2e:formal
              exit $?
            fi
            sleep 1
          done
          cat /tmp/dr-card-playwright-preview.log
          exit 1

      - name: H027 Bridge Lab browser smoke
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/dr-card-bridge-lab-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null; then
              npm run test:e2e:bridge-lab
              exit $?
            fi
            sleep 1
          done
          cat /tmp/dr-card-bridge-lab-preview.log
          exit 1

      - name: Verify H019 evidence assembler
        if: always() && steps.formal-e2e.outcome != 'skipped'
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_PLAYWRIGHT_OUTCOME: ${{ steps.formal-e2e.outcome }}
          EVIDENCE_BRIDGE_STATUS: not verified — H015 real Native protocol is blocked
        run: |
          npm run report:evidence
          test -f test-evidence-site/latest/index.html
          test -f "test-evidence-site/commits/$GITHUB_SHA/summary.json"
          grep -F 'Browser CI evidence only' test-evidence-site/latest/index.html

      - name: Build test bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Optional project-level override; an empty value falls back to .env.test.
          VITE_BUDDY_PUBLIC_ORIGIN: ${{ vars.OSS_PUBLIC_ORIGIN }}
        run: npm run build:test

      - name: Verify test build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='test'||m.dataMode!=='api'||m.bridgeMode!=='native'||m.apiBaseConfigured!==true||m.buddyPublicOriginConfigured!==true)process.exit(1)"
          node -e "const fs=require('fs');const files=fs.readdirSync('dist/assets').filter(x=>x.endsWith('.js'));if(!files.some(x=>fs.readFileSync('dist/assets/'+x,'utf8').includes('https://kbs.3cgroup.cn')))process.exit(1)"
          test ! -f dist/mockServiceWorker.js

      - name: Reject Mock in production-like builds
        shell: bash
        run: |
          if VITE_API_BASE_URL=http://example.invalid VITE_BUDDY_PUBLIC_ORIGIN=http://insecure.example node scripts/build-h5.mjs test --dry-run; then
            echo 'test accepted a non-HTTPS official Buddy QR origin.'
            exit 1
          fi
          if H5_OSS_ARTIFACT=1 OSS_WEB_TARGET=test VITE_API_BASE_URL=http://example.invalid VITE_BUDDY_PUBLIC_ORIGIN=http://insecure.example node scripts/build-h5.mjs test --dry-run; then
            echo 'test OSS accepted a non-HTTPS official Buddy QR origin.'
            exit 1
          fi
          if VITE_DATA_MODE=mock node scripts/build-h5.mjs test --dry-run; then
            echo 'test accepted forbidden API Mock configuration.'
            exit 1
          fi
          if VITE_BRIDGE_MODE=mock node scripts/build-h5.mjs prod --dry-run; then
            echo 'prod accepted forbidden Bridge Mock configuration.'
            exit 1
          fi

      - name: Build production bundle
        env:
          # CI build-only placeholder, not a production deployment configuration.
          VITE_BUDDY_PUBLIC_ORIGIN: https://example.invalid
        run: npm run build:prod

      - name: Verify production build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='prod'||m.dataMode!=='api'||m.build.sha!==process.env.GITHUB_SHA)process.exit(1)"
          test ! -f dist/mockServiceWorker.js

      - name: Verify production excludes Bridge Lab implementation
        shell: bash
        run: |
          # The temporary Home link may still contain the debug route string by maintainer decision.
          # Production safety is that the production router must not bundle the lazy BridgeLab module
          # or its Raw Probe implementation/UI.
          if find dist/assets -type f -name 'BridgeLab-*.js' -print -quit | grep -q .; then
            echo 'Production bundle must not contain a Bridge Lab implementation chunk.'
            exit 1
          fi
          if grep -R --binary-files=text -F 'Android Raw Probe' dist; then
            echo 'Production bundle must not contain Bridge Lab Raw Probe code.'
            exit 1
          fi
          if grep -R --binary-files=text -F 'Run iOS Probe' dist; then
            echo 'Production bundle must not contain Bridge Lab Raw Probe UI.'
            exit 1
          fi

      - name: Verify Cloudflare SPA fallback asset
        run: test -f dist/_redirects && grep -F '/* /index.html 200' dist/_redirects

      - name: Smoke test production preview
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/dr-card-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:4173/profile > /dev/null
              curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dr-card-vite-preview.log
          exit 1

  test-gate:
    name: Test branch gate
    if: github.ref_name == 'test' || github.base_ref == 'test'
    concurrency:
      group: h019-test-evidence
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_APP_ENV: test
      VITE_DATA_MODE: api
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_BUDDY_PUBLIC_ORIGIN: ${{ vars.OSS_PUBLIC_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify test environment policy
        shell: bash
        run: |
          test "$VITE_APP_ENV" = "test"
          test "$VITE_DATA_MODE" = "api"
          test "$VITE_DATA_MODE" != "mock"
          test -n "$VITE_API_BASE_URL"

      - name: Build test bundle
        run: npm run build:test

      - name: Verify test bundle identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='test'||m.dataMode!=='api'||m.bridgeMode!=='native'||m.apiBaseConfigured!==true||m.buddyPublicOriginConfigured!==true)process.exit(1)"
          node -e "const fs=require('fs');const files=fs.readdirSync('dist/assets').filter(x=>x.endsWith('.js'));if(!files.some(x=>fs.readFileSync('dist/assets/'+x,'utf8').includes('https://kbs.3cgroup.cn')))process.exit(1)"

      - name: Verify test bundle has no Mock Service Worker asset
        shell: bash
        run: |
          if find dist -type f -name 'mockServiceWorker.js' -print -quit | grep -q .; then
            echo 'Mock Service Worker asset must not be present in the test bundle.'
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore previous cumulative evidence site
        if: always()
        id: evidence-restore
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-evidence-site
          ARTIFACT_URL="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=h019-evidence-site&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')"
          if [ -z "$ARTIFACT_URL" ]; then
            echo 'No previous H019 site artifact found; starting a new evidence history.'
            exit 0
          fi
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$ARTIFACT_URL" \
            --output /tmp/h019-evidence-site.zip
          unzip -q -o /tmp/h019-evidence-site.zip -d test-evidence-site

      - name: Run production-like test browser gate
        id: test-playwright
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/dr-card-test-playwright.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null; then
              npm run test:e2e:test-gate
              exit $?
            fi
            sleep 1
          done

          cat /tmp/dr-card-test-playwright.log
          exit 1

      - name: Assemble H019 evidence site
        if: always() && steps.evidence-restore.outcome == 'success'
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_PLAYWRIGHT_OUTCOME: ${{ steps.test-playwright.outcome }}
          EVIDENCE_BRIDGE_STATUS: not verified — H015 real Native protocol is blocked
        run: npm run report:evidence

      - name: Write H019 Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f test-evidence-site/summary.md ]; then
            cat test-evidence-site/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## H5 test evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Evidence assembly did not produce summary.md.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw H019 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-test-evidence-${{ github.sha }}
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            playwright-report/
            test-results/
            dist/build-meta.json

      - name: Upload cumulative H019 evidence site
        if: always() && steps.evidence-restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: h019-evidence-site
          overwrite: true
          if-no-files-found: error
          retention-days: 30
          path: test-evidence-site/

      - name: Resolve independent evidence Pages configuration
        if: always() && steps.evidence-restore.outcome == 'success'
        id: evidence-pages-config
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TEST_EVIDENCE_PROJECT || 'dr-card-ui-test-evidence' }}
          CF_BRANCH: ${{ vars.CF_TEST_EVIDENCE_BRANCH || 'main' }}
        run: |
          echo "project=$CF_PROJECT" >> "$GITHUB_OUTPUT"
          echo "branch=$CF_BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$CF_PROJECT" = "dr-card-ui" ]; then
            echo '::warning::H019 refuses to deploy evidence into the formal dr-card-ui Pages project.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          elif [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_PROJECT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::H019 Cloudflare publish skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure independent H019 evidence Pages project
        if: always() && steps.evidence-pages-config.outputs.ready == 'true'
        id: evidence-pages-project
        continue-on-error: true
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ steps.evidence-pages-config.outputs.project }}
          CF_BRANCH: ${{ steps.evidence-pages-config.outputs.branch }}
        run: |
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/h019-cf-project.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Accept: application/json' \
            "$API_BASE/$CF_PROJECT")"

          if [ "$HTTP_CODE" = "200" ]; then
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/h019-cf-project.json','utf8'));if(r.success!==true)process.exit(1)"
            echo "H019 evidence Pages project already exists: $CF_PROJECT"
            exit 0
          fi

          if [ "$HTTP_CODE" != "404" ]; then
            cat /tmp/h019-cf-project.json
            echo "Unexpected Cloudflare project lookup status: $HTTP_CODE"
            exit 1
          fi

          CREATE_BODY="$(node -e "process.stdout.write(JSON.stringify({name:process.env.CF_PROJECT,production_branch:process.env.CF_BRANCH}))")"
          CREATE_CODE="$(curl --silent --show-error --output /tmp/h019-cf-project-create.json --write-out '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$CREATE_BODY" \
            "$API_BASE")"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/h019-cf-project-create.json','utf8'));if(r.success!==true)process.exit(1)"
          if [ "$CREATE_CODE" -lt 200 ] || [ "$CREATE_CODE" -ge 300 ]; then
            cat /tmp/h019-cf-project-create.json
            echo "Cloudflare project create returned status: $CREATE_CODE"
            exit 1
          fi
          echo "Created isolated H019 evidence Pages project: $CF_PROJECT"

      - name: Publish independent H019 evidence Pages
        if: always() && steps.evidence-pages-config.outputs.ready == 'true' && steps.evidence-pages-project.outcome == 'success'
        id: evidence-pages-deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy test-evidence-site --project-name=${{ steps.evidence-pages-config.outputs.project }} --branch=${{ steps.evidence-pages-config.outputs.branch }}

      - name: Record H019 publish status
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.evidence-restore.outcome }}
          CONFIG_READY: ${{ steps.evidence-pages-config.outputs.ready }}
          PROJECT_OUTCOME: ${{ steps.evidence-pages-project.outcome }}
          DEPLOY_OUTCOME: ${{ steps.evidence-pages-deploy.outcome }}
          CF_PROJECT: ${{ steps.evidence-pages-config.outputs.project }}
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Evidence delivery' >> "$GITHUB_STEP_SUMMARY"
          echo '- Raw GitHub artifact: `h019-test-evidence-${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESTORE_OUTCOME" != "success" ]; then
            echo "- Cumulative site: not replaced; the last good history was preserved because restore outcome was \`${RESTORE_OUTCOME:-unknown}\`." >> "$GITHUB_STEP_SUMMARY"
            echo '- Cloudflare Pages: skipped for this run to avoid publishing truncated history.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Cumulative site artifact: `h019-evidence-site`' >> "$GITHUB_STEP_SUMMARY"
            if [ "$CONFIG_READY" != "true" ]; then
              echo '- Cloudflare Pages: skipped (Cloudflare credentials are not fully configured).' >> "$GITHUB_STEP_SUMMARY"
            elif [ "$PROJECT_OUTCOME" != "success" ]; then
              echo "- Cloudflare Pages: project \`$CF_PROJECT\` could not be ensured; GitHub artifacts remain available." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "- Cloudflare Pages: published to isolated project \`$CF_PROJECT\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Cloudflare Pages: publish attempt did not succeed (outcome: \`${DEPLOY_OUTCOME:-unknown}\`); GitHub artifacts remain available." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
